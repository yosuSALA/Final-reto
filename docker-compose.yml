services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/auditor.db
      # Optional: DeepSeek API key (via OpenCode Go recommended)
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - OPENCODE_GO_API_BASE=${OPENCODE_GO_API_BASE:-https://opencode.ai/zen/go/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-deepseek-v4-flash}
    restart: unless-stopped

volumes:
  db_data:
