services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/auditor.db
      # Optional: set your Google AI key to enable the Gemini engine
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    restart: unless-stopped

volumes:
  db_data:
