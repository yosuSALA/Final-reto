<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Agentico | Facturacion de Siniestros</title>
    <meta name="description" content="Sistema agentico que audita automaticamente facturas de talleres para aseguradoras, detectando discrepancias y cobros duplicados.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <!-- NAV -->
    <nav class="nav" id="main-nav">
        <div class="nav-brand">
            <div class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="8" fill="url(#logo-grad)"/>
                    <path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
                </svg>
            </div>
            <span class="nav-title">AuditAgent</span>
            <span class="nav-badge">AI</span>
        </div>
        <div class="nav-links">
            <a href="#dashboard" class="nav-link active" data-page="dashboard" id="nav-dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Dashboard
            </a>
            <a href="#auditorias" class="nav-link" data-page="auditorias" id="nav-auditorias">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
                Auditorias
            </a>
            <a href="#tarifario" class="nav-link" data-page="tarifario" id="nav-tarifario">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Tarifario
            </a>
            <a href="#siniestros" class="nav-link" data-page="siniestros" id="nav-siniestros">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Siniestros
            </a>
            <a href="#upload" class="nav-link" data-page="upload" id="nav-upload">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Subir PDF
            </a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-ghost btn-sm" id="btn-theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema" style="padding:8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-sun" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="btn btn-primary btn-sm" id="btn-run-audit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Ejecutar Auditoria
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main" id="main-content">
        <!-- Dashboard Page -->
        <div class="page active" id="page-dashboard"></div>
        <!-- Auditorias Page -->
        <div class="page" id="page-auditorias"></div>
        <!-- Tarifario Page -->
        <div class="page" id="page-tarifario"></div>
        <!-- Siniestros Page -->
        <div class="page" id="page-siniestros"></div>
        <!-- Upload PDF Page -->
        <div class="page" id="page-upload"></div>
        <!-- Detalle Auditoria -->
        <div class="page" id="page-audit-detail"></div>
    </main>

    <!-- TOAST -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
