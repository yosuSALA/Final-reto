<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aseguradora del Sur | Plataforma de Inteligencia de Seguros</title>
    <meta name="description" content="Plataforma de inteligencia operacional para detección de fraude, gestión de siniestros, análisis de portafolio y cumplimiento normativo.">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <!-- NAV -->
    <nav class="nav" id="main-nav">
        <div class="nav-brand">
            <div class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="8" fill="url(#logo-grad)"/>
                    <path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
                </svg>
            </div>
            <div class="nav-brand-text">
                <span class="nav-title">Aseguradora del Sur</span>
                <span class="nav-badge">Inteligencia</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="#dashboard" class="nav-link active" data-page="dashboard" id="nav-dashboard">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span id="nav-home-label">Dashboard</span>
            </a>
            <a href="#audit-panel" class="nav-link" data-page="audit-panel" id="nav-audit-panel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                Panel Auditoría
            </a>
            <a href="#siniestros" class="nav-link" data-page="siniestros" id="nav-siniestros">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Siniestros
            </a>
            <a href="#auditorias" class="nav-link" data-page="auditorias" id="nav-auditorias">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
                Auditorías
            </a>
            <a href="#tarifario" class="nav-link" data-page="tarifario" id="nav-tarifario">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Tarifario
            </a>
            <a href="#upload" class="nav-link" data-page="upload" id="nav-upload">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Cargar
            </a>
            <a href="#admin-audit" class="nav-link" data-page="admin-audit" id="nav-admin-audit" style="display:none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Auditoría Sistema
            </a>
        </div>
        <div class="nav-actions">
            <span id="nav-role-badge" class="nav-role-indicator"></span>
            <button class="btn btn-ghost btn-sm" id="btn-switch-profile" title="Cambiar de perfil (modo admin)" style="display:none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Cambiar perfil
            </button>
            <button class="btn btn-ghost btn-sm profile-nav-btn" id="btn-sign-out" title="Cerrar sesión">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span id="active-profile-badge" class="profile-badge-text">Sin perfil</span>
                <span class="profile-signout-label">Sign Out</span>
            </button>
            <button class="btn btn-ghost btn-sm" id="btn-theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema" style="padding:8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-sun" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="btn btn-primary btn-sm" id="btn-run-audit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Auditar con IA
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main" id="main-content">
        <div class="page active" id="page-dashboard"></div>
        <div class="page" id="page-audit-panel"></div>
        <div class="page" id="page-auditorias"></div>
        <div class="page" id="page-tarifario"></div>
        <div class="page" id="page-siniestros"></div>
        <div class="page" id="page-upload"></div>
        <div class="page" id="page-audit-detail"></div>
        <div class="page" id="page-claim-workspace"></div>
        <div class="page" id="page-admin-audit"></div>
    </main>

    <div class="toast-container" id="toast-container"></div>
    <div id="audit-queue-widget" class="audit-queue-widget"></div>
    <div id="chatbot-bubble-root" class="chatbot-bubble-root"></div>

    <script type="module" src="js/main.js?v=5"></script>
</body>
</html>
